## Auto-Scout - External Asset Enumeration Pipeline
## Central configuration file

api_keys:
  whoxy: ""
  # bbot module keys (optional, improve subdomain coverage)
  shodan: ""
  censys_id: ""
  censys_secret: ""
  securitytrails: ""
  virustotal: ""
  github: ""
  chaos: ""
  # Free SSLMate key (https://sslmate.com/signup) for bbot's certspotter module.
  # Leave blank to keep certspotter disabled (it is rate-limited to the point of
  # stalling stage 6 when unauthenticated). Setting a key auto-enables it on its
  # fast, complete paginated path.
  sslmate: ""

seeds:
  corporations: "seeds/corporations.txt"
  domains: "seeds/domains.txt"
  whois_names: "seeds/whois_names.txt"
  whois_orgs: "seeds/whois_orgs.txt"
  whois_emails: "seeds/whois_emails.txt"
  # Out-of-scope lists are checked before each stage runs (to save queries) and
  # after discovery, before the human review gate. Removed items are logged to
  # <stage>/scope_removed.json.
  #   out_of_scope_domains: one domain per line; matches the domain and all its
  #     subdomains (exact match, not regex). Applied in stages 3, 4, 5, 6.
  #     For regex CDN/junk filtering use cleanup.excluded_domain_patterns instead.
  #   out_of_scope_terms: search input terms to never query; drops corporation
  #     terms in s2 (ASN search) and whois names/orgs/emails in s4.
  #   out_of_scope_asns: ASNs to always exclude in s2 (AS1234 / 1234 equivalent).
  out_of_scope_domains: "seeds/out_of_scope_domains.txt"
  out_of_scope_terms: "seeds/out_of_scope_terms.txt"
  out_of_scope_asns: "seeds/out_of_scope_asns.txt"

asn_discovery:
  cache_dir: ".cache/asndb"
  cache_max_age_hours: 24
  asn_json_url: "https://asndb.network/get/latest/asn.json"
  ip_dat_url: "https://asndb.network/get/latest/ip.dat"

reverse_dns:
  base_url: "https://ip.thc.org"
  page_size: 100
  request_delay_seconds: 2.0   # matches THC's 0.5 req/s refill (1 per 2s)
  progress_save_interval: 50
  max_retries_on_429: 6         # per-IP retries with exponential backoff on 429
  max_consecutive_failures: 5   # abort+save after this many IPs fail in a row
  bulk:
    # Offline alternative to the per-IP API: query THC's monthly bulk parquet
    # snapshot locally with DuckDB. See stages/s3_rdns_bulk.py.
    duckdb_bin: "duckdb"          # path to the duckdb CLI binary
    parquet_path: ""              # path to the DECOMPRESSED rdns-*.parquet
    ip_column: ""                 # auto-detected when empty
    domain_column: ""             # auto-detected when empty
    max_expanded_ips: 20000000    # safety cap on the target-IP set
    query_timeout_seconds: 7200   # DuckDB scan can take a while on 79GB

reverse_whois:
  whoxy_base_url: "https://api.whoxy.com"
  mode: "micro"
  request_delay_seconds: 1.0

cleanup:
  parking_indicators:
    - "parked free"
    - "godaddy"
    - "this domain is for sale"
    - "hugedomains"
    - "sedoparking"
    - "parkingcrew"
    - "buy this domain"
    - "domain parking"
    - "this webpage is parked"
    - "sedo.com"
  excluded_domain_patterns:
    - '\.akamai\.net$'
    - '\.akamaiedge\.net$'
    - '\.akamaitechnologies\.com$'
    - '\.cloudfront\.net$'
    - '\.amazonaws\.com$'
    - '\.azure-dns\.com$'
    - '\.azurewebsites\.net$'
    - '\.trafficmanager\.net$'
    - '\.googleusercontent\.com$'
  parking_check_timeout: 5
  parking_check_threads: 20

subdomain_enum:
  bbot_flags:
    - "subdomain-enum"
  bbot_exclude_flags: []
  # Modules listed here are always excluded. certspotter is additionally
  # auto-excluded unless api_keys.sslmate is set (see above), so you don't need
  # to list it here.
  bbot_exclude_modules: []
  batch_size: 20
  timeout_minutes: 120

port_scan:
  masscan_rate: 10000
  masscan_top_ports: 100
  nmap_top_ports: 1000
  nmap_supplemental_ports: []
  nmap_options: "-sV --open --version-intensity 2 --min-rate 1000"
  nmap_timing: "-T4"
  nmap_max_parallelism: 50

web_analysis:
  # Fallback ports: only used when nmap couldn't fingerprint the service.
  # If nmap identifies a service as http/https, it's screenshotted regardless of port.
  http_fallback_ports:
    - 80
    - 443
    - 8080
    - 8443
    - 8000
    - 8888
    - 9443
  gowitness_threads: 10
  gowitness_timeout: 15

extras:
  dns_security: true
  google_dorks: true
  dkim_selectors:
    - "google"
    - "default"
    - "selector1"
    - "selector2"
    - "k1"
    - "mail"
    - "dkim"

review:
  mode: "halt"

output:
  base_dir: "runs"
